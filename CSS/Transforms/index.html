<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transforms</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            background: beige;
            border: 2px solid black;
            /* transform: rotate(30deg); */
            /* transform: scale(); */
            /* transform: skew(34deg); */
            transform: translateY(100%) skew(45deg) translateX(45%);
            
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container{
            height: 80vh;
            width: 100vw;
            border: 2px solid purple;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">BOX</div>
    </div>
    </body>
</html>
