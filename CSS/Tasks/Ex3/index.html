<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Design Exercise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Pacifico&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <style>
        .card {
            height: 450px;
            width: 300px;
            border: 2px solid rgb(174, 162, 162);
            border-radius: 10px;
            position: absolute;
            padding: 5px;
        }

        .card img {
            height: 200px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .tag {
            border: 2px solid rgb(174, 162, 162);
            padding: 3px;
            font-family: "Poppins", sans-serif;
            border-radius: 10px;
        
        }

        .heading {
            font-family: "Poppins", sans-serif;
            margin-top: 12px;
            font-size: 25px;
            font-weight: 600;
        }
       .card p{
        margin-top: 3;
        margin-bottom: 0;
         font-family: "Poppins", sans-serif;
         line-height: 120%;
         
       }
       .card button{
        position: absolute;
        bottom: 10px;
        left: 35%;
        background: transparent;
        color: rgb(46, 46, 214) ;
        font-size: 15px;
        border-radius: 10px;
         font-family: "Poppins", sans-serif;
         background-color: lightblue;
         border-color: transparent;
       }
    </style>
</head>

<body>
    <div class="card">
        <img src="https://images.pexels.com/photos/35956956/pexels-photo-35956956.jpeg" alt="Picture of Bus Stand">

        <span class="tag">Raining</span>
        <span class="tag">Waiting</span>
        <div class="heading">Lahore Bus Stand</div>
        <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Maxime, distinctio consectetur reiciendis iste minima voluptas eaque ipsa officia soluta sunt eius veritatis.</p>
          <button>Read More</button>
    </div>
  
</body>

</html>
