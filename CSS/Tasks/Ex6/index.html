<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultraedit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Pacifico&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <style>
        nav {
            height: 15vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 80vw;
            margin-left: 10vw;
            margin-right: 10vw;
            background-color: #f6f6f6;
            ;
            border-radius: 10px;
            border: 1px solid black;
            flex-wrap: wrap;
            font-family: "Poppins", sans-serif;

        }

        ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .button {
            height: 10vh;
            width: 10vw;
            border: none;
            margin-right: 10px;
            padding: 15px;
            font-size: 15px;
            border-radius: 4px;
        }

        .download {
            background-color: yellow;
            /* border: none; */
            border-radius: 4px;

        }

        #select_language {
            background-color: #f6f6f6;
            border: 1px solid black;
        }
    
    </style>
</head>

<body>
    <nav>
        <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE-logo.svg" alt="Ultraedit Logo">
        <ul>
            <li>Products</li>
            <li>Buy</li>
            <li>Renew</li>
            <li>Support</li>
            <li>Learn</li>
            <li>Company</li>
        </ul>
        <div class="action-buttons">

            <button class="button download">Download</button>
            <select name="languages" id="select_language" class="button">
                <option value="apple">English</option>
                <option value="banana">Urdu</option>
                <option value="cherry">Arabic</option>
            </select>
        </div>
    </nav>
</body>

</html>
