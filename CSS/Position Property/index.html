<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

          .box {
            border: 2px solid black;
            height: 433px;
            width: 80vw;
            padding: 3px;
            margin: 13px;
        }
        .box1 {
            background-color: aqua;
            position: sticky;
            top: 0px;
            margin: 0;
            padding: 0;
            height: 111px;
            width: 60vw;
            left: 20vw;
            border-radius: 20px;
        }

        .box2 {
            background-color: azure;
            /* position: relative;
            top: 23px;
            left: 45px; */
        }

        .box3 {
            background-color: antiquewhite;
            height: 111px;
            width: 60vw ;
            position: fixed;
            left: 15vw;
            bottom: 0px;
            border-radius: 20px;
        }

        .box4 {
            background-color: purple;
        }

        .parent{
            padding: 23px;
            margin: 23px;
            border: 3px solid purple;
            position: absolute;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
