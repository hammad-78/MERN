<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container{
            border: 2px solid red;
            display: flex;
            height: 80vh;
            /* justify-content is used for main-axis */
            justify-content: center; 

            /* align-item is used for cross-axis */
            align-items: center;

            /* flex-direction: row-reverse; */

            flex-wrap: wrap;
            gap: 10px;
        }
        .item{
            height: 92px;
            width: 92px;
            /* margin: 4px; */
            border: 2px solid black;
            background-color: blueviolet;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
