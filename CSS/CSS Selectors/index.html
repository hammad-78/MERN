<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* Element Selector */
        /* div{
            background-color: red;
        } */

        /* Class Selector */
        .red{
            background-color: red;
        }

        /* ID Selector */
        #green{
            background-color: green;
        }

        /* Child Selector */
        div > p{
            background-color: yellow;
            color: blue;
        }

        /* Descendent Selector */
        div p{
            background-color: yellow;
            color: blue;
        }

        /* Universal Selector */
        *{
            margin: 0;
            padding: 0;
        }

        /* Pseudo Selectors */

        a:link{
            color: green;
        }
        a:hover{
            background-color: yellow;
        }
        a:visited{
            color: blue;
        }

        p:first-child{
            background-color: aqua;
        }
        
    </style>
</head>
<body>

    <div class="one">
        <p>I am First child Para</p>
        <p>I am Second Child Para</p>
    </div>
    <div class="red">
        I am a Div

        <Article> 
            <p>I am a para inside Div</p>
        </Article>
    </div>
    <div id="green">
        I am a Div
    </div>
    <a href="https://www.google.com/">Go to Google</a>
    <a href="https://www.Facebook.com/">Go to Facebook</a>
    
</body>
</html>
