<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            border: 2px solid blue;
            box-sizing: border-box;
            display: inline-block;
            width: 233px;
            padding: 45px;
            margin: 24px;
            /* display: none; */
        }
        .box1{
            /* display: none; */
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="box box1">
        I am a box
    </div>
    <div class="box">and also a nice box</div>
    <span>I am a good</span>
    <span>boy</span>
</body>
</html>
